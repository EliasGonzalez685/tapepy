name: tapepy
description: >
  TapePy — plataforma de gestión para asociaciones de transporte
  (alternativo y taxis). Traude es la primera organización/cliente
  que corre sobre la plataforma.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # Backend / datos
  supabase_flutter: ^2.5.0

  # Notificaciones push
  firebase_core: ^4.11.0
  firebase_messaging: ^16.3.0

  # Variables de entorno (URL/anon key de Supabase, sin hardcodear)
  flutter_dotenv: ^5.1.0

  # Carnet digital: PDF + QR
  pdf: ^3.10.8
  printing: ^5.12.0
  qr_flutter: ^4.1.0

  # Utilidades
  intl: ^0.19.0
  http: ^1.2.0
  path_provider: ^2.1.2
  share_plus: ^10.1.4       # compartir varios documentos juntos por WhatsApp/etc.
  image_picker: ^1.0.7      # subir fotos de documentos/cédulas
  image_cropper: ^8.1.0     # recortar/ajustar la foto antes de subirla (vehículos y documentos)
  # Fijado en 10.3.10 a propósito: 11.0.0/11.0.1/11.0.2 tienen un bug
  # conocido de compilación en Android (falta el plugin de Kotlin en su
  # propio build.gradle — github.com/miguelpruivo/flutter_file_picker/issues/1973).
  # No subir de versión sin confirmar antes que esté resuelto.
  file_picker: 10.3.10

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  # Genera el ícono real de la app (Android/iOS) a partir del logo de
  # TapePy, reemplazando el ícono default de Flutter. Ver README /
  # instrucciones: correr `dart run flutter_launcher_icons` una vez
  # después de agregar esta dependencia.
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/images/
    - assets/icons/

# Configuración de flutter_launcher_icons: usa el logo de TapePy (la
# plataforma) como ícono de la app, no el de Traude (que es solo la
# primera organización que corre sobre la plataforma).
flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/tapepy_logo.png"
  min_sdk_android: 21
  remove_alpha_ios: true
